site_name: ChronoClade
site_url: https://ghruproject.github.io/chronoclade/
site_description: Recombination-aware temporal analysis of bacterial lineages
repo_name: ghruproject/chronoclade
repo_url: https://github.com/ghruproject/chronoclade
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/chart-timeline-variant-shimmer
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Use light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Overview: index.md
  - Getting started:
      - Installation: installation.md
      - Input data: input-data.md
      - Running an analysis: running.md
      - Independent tool suite: independent-suite.md
      - Independent preparation: prepare.md
      - Independent cgMLST: cgmlst.md
      - Large cgMLST blocks: cgmlst-scale.md
      - Independent tree stage: tree-stage.md
      - Independent time stage: time-stage.md
      - Profile-first stages: staged-workflow.md
  - Worked example: worked-example.md
  - Apple Silicon Klebsiella walkthrough: mac-klebsiella-walkthrough.md
  - Klebsiella beta example: beta/WORKED_EXAMPLE.md
  - Pathogenwatch context:
      - Frozen metadata: pathogenwatch.md
      - cgLIN assignments: cglin.md
      - New assembly typing and HierCC: query-typing.md
      - Country figures: context-geography.md
      - Laptop and SLURM pilot: pathogenwatch-pilot.md
  - Reading the report: report.md
  - Methods: methods.md
  - Interpretation: interpretation.md
  - Reference:
      - Command line: cli.md
      - Output files: outputs.md
  - Local beta acceptance:
      - Current local closeout: beta/LOCAL_BETA_CLOSEOUT.md
      - Specification: beta/BETA_SPECIFICATION.md
      - Acceptance matrix: beta/ACCEPTANCE_PLAN.md
      - Progress and evidence: beta/PROGRESS.md
      - User walkthrough: beta/USER_WALKTHROUGH.md
      - Simulated user reviews: beta/SIMULATED_REVIEWS.md
      - Installation checks: beta/INSTALL_ACCEPTANCE.md
      - Published benchmarks: beta/BENCHMARK_PLAN.md
      - Grouping method review: beta/GROUPING_METHOD_REVIEW.md
      - Resource measurements: beta/PERFORMANCE_ACCEPTANCE.md
      - Reproducibility checks: beta/REPRODUCIBILITY_AUDIT.md
  - Development:
      - Design notes: DESIGN.md
      - Tool suite redesign: tool-suite-design.md
      - Suite architecture review: architecture-review.md
      - Parked embedding research: research/parked-sequence-embeddings.md
      - Public-health questions: PUBLIC_HEALTH_QUESTIONS.md
      - Roadmap: ROADMAP.md
      - Code review: CODE_REVIEW.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ghruproject/chronoclade

copyright: ChronoClade is distributed under the GPL-3.0-or-later licence.

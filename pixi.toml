[workspace]
authors = ["Nabil-Fareed Alikhan <nabil.alikhan@cgps.group>"]
channels = ["conda-forge", "bioconda"]
name = "chronoclade"
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[dependencies]
python = "3.11.*"
clonalframeml = ">=1.20,<1.21"
iqtree = ">=2.4,<4"
ska2 = ">=0.5.1,<0.6"
treetime = ">=0.12.1,<0.13"
phipack = ">=1.1,<1.2"

[pypi-dependencies]
chronoclade = { path = ".", editable = true }
atbfetcher = { git = "https://github.com/happykhan/atbfetcher.git", rev = "4c1b936137ba3dbe125ac7cf612d19a1a0d5a7df" }

[tasks]
chronoclade = "chronoclade"
test = "python -m pytest -q"
lint = "ruff check ."
format = "ruff format ."
docs = "python scripts/build_docs.py"
docs-serve = "mkdocs serve"

[feature.dev.pypi-dependencies]
pytest = ">=8,<9"
ruff = ">=0.12,<0.13"
mkdocs-material = ">=9.6,<10"

[environments]
default = { features = ["dev"], solve-group = "default" }

[workspace]
authors = ["Nabil-Fareed Alikhan <nabil.alikhan@cgps.group>"]
channels = ["conda-forge", "bioconda"]
name = "chronoclade"
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[dependencies]
python = "3.11.*"

[pypi-dependencies]
chronoclade = { path = ".", editable = true }

[tasks]
chronoclade = "chronoclade"
test = "python -m pytest -q"
lint = "ruff check ."
format = "ruff format ."
docs = "python scripts/build_docs.py"
docs-serve = "mkdocs serve"

# Classical seven-locus MLST with its versioned bundled PubMLST database.
[feature.mlst.dependencies]
# Newer builds require libxcrypt1, unavailable on macOS in the configured channels.
mlst = "==2.32.2"

[feature.tree.dependencies]
clonalframeml = ">=1.20,<1.21"
iqtree = ">=2.4,<4"
ska2 = ">=0.5.1,<0.6"
blast = ">=2.16,<3"
phipack = ">=1.1,<2"
# Verticall depends on pytest; keep its conda version compatible with dev PyPI.
verticall = ">=0.4.3,<0.5"
minimap2 = ">=2.28,<3"
pytest = ">=8,<9"

[feature.time.dependencies]
treetime = ">=0.12.1,<0.13"

[feature.scale.dependencies]
scipy = ">=1.14,<2"
mafft = ">=7.526,<8"

[feature.scale.target.linux-64.dependencies]
rapidnj = ">=2.3,<3"

[feature.dev.pypi-dependencies]
pytest = ">=8,<9"
ruff = ">=0.12,<0.13"
mkdocs-material = ">=9.6,<10"

[environments]
default = { features = ["dev", "tree", "time", "scale"], solve-group = "default" }
prepare = { features = [], solve-group = "profiles" }
cgmlst = { features = ["scale"], solve-group = "profiles" }
tree = { features = ["tree", "time"], solve-group = "default" }
time = { features = ["time"], solve-group = "default" }

# Keep classical MLST/BioPerl dependencies separate from inference environments.
mlst = { features = ["mlst"], solve-group = "mlst", no-default-feature = true }
